<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurnTrack</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('turntrack-theme'); } catch (e) {}
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --page-bg: #0C2638;
    --sheet-bg: #FBFAF7;
    --card-bg: #FFFFFF;
    --ink: #0B2740;
    --ink-soft: #52697A;
    --muted: #93A6B0;
    --border: #E7E4DC;
    --teal: #16B3A8;
    --teal-ink: #06302C;
    --navy: #0B3A5B;
    --rail-ink-dim: #7391A0;
    --danger-fg: #B13434; --danger-bg: #FBEAEA; --danger-glow: rgba(177,52,52,.22);
    --soon-fg: #9A6A12; --soon-bg: #FDF3E3; --soon-glow: rgba(154,106,18,.22);
    --ok-fg: #0E7A67; --ok-bg: #E7F6F2;
    --pending-bg: #EFEDE6; --pending-fg: #52697A;
    --progress-bg: rgba(22,179,168,.16); --progress-fg: #0C8A80;
    --ready-bg: rgba(11,58,91,.12); --ready-fg: #0B3A5B;
    --collected-bg: #E7E4DC; --collected-fg: #93A6B0;
    --shadow-card: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(11,39,64,.05), 0 14px 30px rgba(11,39,64,.08);
    --hover: rgba(11,39,64,.03);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --page-bg: #070F16; --sheet-bg: #0F1D27; --card-bg: #162834;
    --ink: #EAF2F4; --ink-soft: #B9CAD2; --muted: #7E97A1; --border: #223640;
    --teal: #33C9BF; --teal-ink: #06302C; --navy: #8FC7E8;
    --danger-bg: #3A1E1E; --danger-fg: #F2A6A6; --danger-glow: rgba(242,102,123,.28);
    --soon-bg: #3A2E13; --soon-fg: #F2CE86; --soon-glow: rgba(242,184,75,.26);
    --ok-bg: #12332C; --ok-fg: #7FE0C9;
    --pending-bg: #223640; --pending-fg: #B9CAD2;
    --progress-bg: rgba(51,201,191,.18); --progress-fg: #6FE3DA;
    --ready-bg: rgba(143,199,232,.14); --ready-fg: #8FC7E8;
    --collected-bg: #1C2D33; --collected-fg: #7E97A1;
    --shadow-card: 0 1px 0 rgba(255,255,255,.06) inset, 0 1px 2px rgba(0,0,0,.4), 0 14px 30px rgba(0,0,0,.45);
    --hover: rgba(255,255,255,.04);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--page-bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    font-feature-settings: "tnum";
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  button, input, textarea { font-family: inherit; }

  .app { display: flex; min-height: 100vh; }

  /* ---- Left rail ---- */
  .rail { width: 216px; flex-shrink: 0; padding: 1.3rem 0.9rem; display: flex; flex-direction: column; gap: 1.9rem; position: relative; }
  .rail::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 28px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.22)); pointer-events: none; }
  .rail-brand { display: flex; align-items: center; gap: 10px; padding: 0 0.4rem; }
  .rail-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #1fd0c3, #0c8a80); display: flex; align-items: center; justify-content: center; color: var(--teal-ink); font-size: 15px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset, 0 6px 16px rgba(22,179,168,.4); }
  .rail-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .rail-brand-text p { margin: 0; }
  .rail-name { color: #fff; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; font-family: 'Inter Tight', sans-serif; }
  .rail-sub { color: var(--rail-ink-dim); font-size: 10.5px; margin-top: 1px !important; }
  .rail-nav { display: flex; flex-direction: column; gap: 1px; }
  .rail-link { display: flex; align-items: center; gap: 10px; padding: 7.5px 10px; border-radius: 7px; color: var(--rail-ink-dim); font-size: 12.5px; font-weight: 500; border: none; background: transparent; width: 100%; text-align: left; cursor: pointer; }
  .rail-link.active { background: linear-gradient(90deg, rgba(22,179,168,.22), rgba(255,255,255,.04)); box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; color: #fff; }
  .rail-link.active i { color: #3fe3d6; }
  .rail-link.disabled { opacity: .55; }
  .rail-link i { font-size: 15px; width: 15px; text-align: center; }
  .rail-soon { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .02em; color: var(--rail-ink-dim); }
  .rail-divider { height: 1px; background: rgba(255,255,255,.08); margin: 0 0.4rem; }
  .rail-foot { margin-top: auto; padding: 0 0.4rem; }
  .rail-foot p { margin: 0; color: var(--rail-ink-dim); font-size: 10.5px; }

  /* ---- Main column ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .chrome { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.6rem; color: #fff; gap: 12px; }
  .search-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 9px; padding: 7px 12px; width: 240px; max-width: 40vw; color: var(--rail-ink-dim); font-size: 12.5px; }
  .search-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 12.5px; width: 100%; }
  .search-box input::placeholder { color: var(--rail-ink-dim); }
  .chrome-right { display: flex; align-items: center; gap: 16px; }
  .bell { color: var(--rail-ink-dim); font-size: 17px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #1C3B52; color: #cfe3ea; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }

  .sheet { flex: 1; background: var(--sheet-bg); border-radius: 20px 20px 0 0; padding: 1.6rem 1.9rem 2.4rem; box-shadow: 0 -10px 40px rgba(0,0,0,.25); transition: background .3s; }

  .topline { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.2rem; gap: 12px; flex-wrap: wrap; }
  .page-title { font-family: 'Inter Tight', sans-serif; font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .page-sub { font-size: 12.5px; color: var(--muted); margin: 3px 0 0; }
  .add-btn { display: flex; align-items: center; gap: 7px; background: linear-gradient(135deg, #12b9ad, #0b6f9a); color: #fff; border: none; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 10px; cursor: pointer; box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 20px rgba(18,185,173,.35); transition: transform .15s, box-shadow .15s; }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 12px 24px rgba(18,185,173,.42); }
  .add-btn:active { transform: translateY(0) scale(.98); }

  .banner { background: var(--soon-bg); color: var(--soon-fg); border-radius: 9px; padding: 9px 13px; font-size: 0.85rem; margin-bottom: 14px; display: none; }
  .banner.show { display: block; }

  .stat-strip { display: flex; align-items: center; gap: 26px; padding: 0 0 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .stat-chip p { margin: 0; }
  .stat-chip .v { font-family: 'Inter Tight', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .stat-chip .l { font-size: 11px; color: var(--muted); font-weight: 500; }
  .export-btn { margin-left: auto; display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--border); color: var(--ink-soft); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .export-btn:hover { background: var(--hover); }

  .priority-banner { display: none; background: var(--danger-bg); border: 1px solid var(--danger-glow); border-radius: 14px; padding: 11px 15px; margin-bottom: 1.3rem; box-shadow: 0 0 24px var(--danger-glow); }
  .priority-banner-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--danger-fg); margin-bottom: 6px; }
  .priority-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; font-size: 12.5px; }
  .priority-row .pclient { font-weight: 600; }
  .priority-row .pitems { color: var(--ink-soft); font-size: 11.5px; }
  .priority-row .pbadge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .priority-row .pbadge.overdue { background: linear-gradient(135deg, #d04a4a, #a42f2f); color: #fff; box-shadow: 0 0 12px var(--danger-glow); }
  .priority-row .pbadge.soon { background: linear-gradient(135deg, #d29a2a, #9a6a12); color: #fff; box-shadow: 0 0 12px var(--soon-glow); }

  .filters-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; gap: 10px; flex-wrap: wrap; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--ink-soft); font-weight: 500; cursor: pointer; }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .show-collected-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  thead th { text-align: left; font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .01em; padding: 0 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 11px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.row-overdue { background: rgba(177,52,52,.04); }
  tbody tr.row-soon { background: rgba(154,106,18,.04); }
  tbody tr.row-collected { opacity: .55; }
  .client-cell .name { font-weight: 600; margin: 0; }
  .client-cell .items { font-size: 12px; color: var(--ink-soft); margin: 2px 0 0; }
  .client-cell .row-notes { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 2px 0 0; }
  .mono { font-feature-settings: "tnum"; color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; }
  .turnaround { color: var(--muted); }

  .badge { font-size: 11px; font-weight: 600; padding: 4px 9px 4px 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .badge.overdue { background: var(--danger-bg); color: var(--danger-fg); }
  .badge.overdue::before { background: var(--danger-fg); }
  .badge.soon { background: var(--soon-bg); color: var(--soon-fg); }
  .badge.soon::before { background: var(--soon-fg); }
  .badge.ontrack { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.ontrack::before { background: var(--ok-fg); }
  .badge.done { background: var(--collected-bg); color: var(--collected-fg); }
  .badge.done::before { background: var(--collected-fg); }
  .badge.overdue { box-shadow: 0 0 10px var(--danger-glow); }
  .badge.soon { box-shadow: 0 0 10px var(--soon-glow); }

  .status-pill { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: none; cursor: pointer; white-space: nowrap; background: var(--pending-bg); color: var(--pending-fg); transition: transform .12s; }
  .status-pill:active:not(:disabled) { transform: scale(.92); }
  .status-pill.in_progress { background: var(--progress-bg); color: var(--progress-fg); box-shadow: 0 0 10px rgba(22,179,168,.2); }
  .status-pill.ready { background: var(--ready-bg); color: var(--ready-fg); }
  .status-pill.collected { background: var(--collected-bg); color: var(--collected-fg); cursor: default; }
  .status-pill.urgent { background: var(--danger-fg) !important; color: #fff !important; }
  .status-pill:disabled { cursor: default; }

  .row-actions { display: flex; gap: 5px; justify-content: flex-end; }
  .icon-btn { width: 27px; height: 27px; border-radius: 7px; border: 1px solid var(--border); background: var(--card-bg); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
  .icon-btn:hover { background: var(--hover); }
  .right { text-align: right; }
  .empty-state { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13px; }

  /* ---- Add-order modal ---- */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(5,14,22,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal-overlay.show { display: flex; }
  .modal-card { background: var(--card-bg); color: var(--ink); border: 1px solid var(--border); border-radius: 18px; padding: 1.4rem 1.5rem; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 70px rgba(0,0,0,.45); animation: modalUp .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes modalUp { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h2 { font-family: 'Inter Tight', sans-serif; font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .full { grid-column: 1 / -1; }
  label { font-size: 11.5px; color: var(--ink-soft); display: block; margin-bottom: 4px; font-weight: 500; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink); font-size: 13px;
  }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .quick-clients { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .btn { background: linear-gradient(135deg, #12b9ad, #0b6f9a); color: #fff; border: none; border-radius: 10px; padding: 11px 16px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 4px; box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 8px 18px rgba(18,185,173,.3); }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); font-weight: 500; box-shadow: none; }

  /* ---- Print ticket modal (kept simple/print-safe) ---- */
  .ticket-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .ticket-overlay.show { display: flex; }
  .ticket-modal { background: #fff; color: #000; border-radius: 14px; padding: 24px; max-width: 320px; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .ticket-modal .t-client { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
  .ticket-modal .t-due { font-size: 1.1rem; font-weight: 700; margin: 0 0 14px; padding: 6px 0; border-top: 2px dashed #000; border-bottom: 2px dashed #000; }
  .ticket-modal .t-row { font-size: 0.95rem; margin: 6px 0; }
  .ticket-modal .t-label { color: #555; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .ticket-modal .t-ref { margin-top: 16px; font-size: 0.78rem; color: #555; }
  .ticket-modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .ticket-modal-actions .btn { width: auto; flex: 1; }
  @media print {
    body > *:not(.ticket-overlay) { display: none !important; }
    .ticket-overlay { position: static !important; background: none !important; display: block !important; padding: 0 !important; }
    .ticket-overlay { position: static !important; }
    .ticket-modal { box-shadow: none !important; max-width: none !important; }
    .ticket-modal-actions { display: none !important; }
  }

  /* ---- Dashboard view ---- */
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 1.5rem; }
  .hero-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem 1.25rem; box-shadow: var(--shadow-card); position: relative; overflow: hidden; transition: background .3s; }
  .hero-card::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 2px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, transparent, var(--teal), transparent); opacity: .85; }
  .hero-card .l { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  .hero-card .v { font-family: 'Inter Tight', sans-serif; font-size: 32px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }

  .dash-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }

  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow-card); transition: background .3s; }
  .panel-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 0 0 12px; }

  .activity-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .activity-row:last-child { border-bottom: none; }
  .aclient { font-size: 13px; font-weight: 600; margin: 0; }
  .aitems { font-size: 11.5px; color: var(--ink-soft); margin: 2px 0 0; }
  .activity-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .atime { font-size: 10.5px; color: var(--muted); }

  .trend-chart { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; height: 110px; padding-top: 10px; }
  .trend-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .trend-bar-wrap { height: 64px; display: flex; align-items: flex-end; }
  .trend-bar { width: 17px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #3fe3d6, #12a69b 70%, #0b6f9a); box-shadow: 0 0 14px rgba(22,179,168,.35); height: var(--h); min-height: 4px; }
  .trend-chart.animate .trend-bar { height: 0; animation: barGrow .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes barGrow { to { height: var(--h); } }
  #dashboardView, #ordersView { animation: viewIn .3s ease; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---- Theme toggle ---- */
  .theme-toggle { width: 52px; height: 28px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); position: relative; cursor: pointer; padding: 0; flex-shrink: 0; }
  .theme-toggle .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #fff, #cfe3ea); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #0b2740; transition: transform .25s cubic-bezier(.3,.7,.2,1); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  :root[data-theme="dark"] .theme-toggle .knob { transform: translateX(24px); background: linear-gradient(135deg, #33c9bf, #1a8f87); color: #04302c; }
  @media (prefers-reduced-motion: reduce) { .trend-chart.animate .trend-bar, .modal-card, #dashboardView, #ordersView { animation: none; } }
  .trend-count { font-size: 11px; font-weight: 600; margin: 0; color: var(--ink-soft); }
  .trend-label { font-size: 10px; color: var(--muted); margin: 0; }

  .quick-add-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ink); color: #fff; border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  .quick-add-card p { margin: 0; font-size: 13px; }
  .quick-add-card .add-btn { background: var(--teal); color: var(--teal-ink); }

  @media (max-width: 760px) {
    .rail { display: none; }
    .search-box { width: 160px; }
    .sheet { padding: 1.2rem 1rem 2rem; border-radius: 14px 14px 0 0; }
    .chrome { padding: 0.8rem 1rem; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="rail">
    <div class="rail-brand">
      <div class="rail-mark"><img id="brandLogoImg" style="display:none;" alt=""></div>
      <div class="rail-brand-text">
        <p class="rail-name" id="brandName">TurnTrack</p>
        <p class="rail-sub" id="brandSub">Loading…</p>
      </div>
    </div>
    <div class="rail-nav">

<script>
(function () {
  // ---- Supabase config ----
  const SUPABASE_URL = 'https://ahzrlbhhnythwyxxwbgq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoenJsYmhobnl0aHd5eHh3YmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDE3MTQsImV4cCI6MjEwNTU3NzcxNH0.voe6jbAILFDrp_aINt6E5887DNpRCdbbXGszsKwT9as';
  const params = new URLSearchParams(window.location.search);
  const LOCATION_SLUG = params.get('location') || 'clieveragh-965260a3';

  const sb = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  const state = { orders: [], clients: [] };
  let locationRow = null;

  const STATUS_ORDER = ['pending', 'in_progress', 'ready', 'collected'];
  const STATUS_LABEL = { pending: 'Pending', in_progress: 'In progress', ready: 'Ready', collected: 'Collected' };

  let filterStatus = 'all';
  let searchTerm = '';
  let showCollected = false;

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function addDays(dateStr, days) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + Number(days));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function daysBetween(a, b) {
    const d1 = new Date(a + 'T00:00:00');
    const d2 = new Date(b + 'T00:00:00');
    return Math.round((d2 - d1) / 86400000);
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function formatLongDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function dueBadge(order) {
    if (order.status === 'collected') return { cls: 'done', text: 'Collected' };
    const diff = daysBetween(todayISO(), order.dueDate);
    if (diff < 0) return { cls: 'overdue', text: `Overdue ${Math.abs(diff)}d` };
    if (diff === 0) return { cls: 'soon', text: 'Due today' };
    if (diff === 1) return { cls: 'soon', text: 'Due tomorrow' };
    return { cls: 'ontrack', text: `Due in ${diff}d` };
  }

  function rowClass(order, badge) {
    if (order.status === 'collected') return 'row-collected';
    if (badge.cls === 'overdue') return 'row-overdue';
    if (badge.cls === 'soon') return 'row-soon';
    return '';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  function relativeTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 1) return 'Just now';
    if (diffMin < 60) return `${diffMin}m ago`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `${diffH}h ago`;
    const diffD = Math.round(diffH / 24);
    if (diffD === 1) return 'Yesterday';
    if (diffD < 7) return `${diffD}d ago`;
    return formatDate(iso.slice(0, 10));
  }

  function initialsFrom(name) {
    const words = String(name || 'TurnTrack').trim().split(/\s+/).filter(Boolean);
    if (words.length === 0) return 'TT';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  // ---- Map between Supabase's snake_case rows and this app's camelCase orders ----
  function fromDb(row) {
    return {
      id: row.id,
      client: row.client,
      items: row.items,
      notes: row.notes || '',
      dateIn: row.date_in,
      dueDate: row.due_date,
      turnaroundDays: row.turnaround_days,
      status: row.status,
      collectedAt: row.collected_at,
      createdAt: row.created_at
    };
  }

  function updateClientList() {
    const list = document.getElementById('clientList');
    list.innerHTML = state.clients.map(c => `<option value="${escapeHtml(c)}">`).join('');

    const freq = {};
    state.orders.forEach(o => { freq[o.client] = (freq[o.client] || 0) + 1; });
    const top = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 6);
    const quick = document.getElementById('quickClients');
    quick.innerHTML = top.map(c => `<button type="button" class="chip quick-chip" data-client="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
    quick.querySelectorAll('.quick-chip').forEach(btn => {
      btn.addEventListener('click', () => { document.getElementById('clientInput').value = btn.dataset.client; });
    });
  }

  function startOfWeekLocal(d) {
    const day = (d.getDay() + 6) % 7; // Monday = 0
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
    return s;
  }

  function renderHistoryStats() {
    const now = new Date();
    const todayStr = todayISO();
    const weekStart = startOfWeekLocal(now);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

    let today = 0, week = 0, month = 0;
    state.orders.forEach(o => {
      if (o.status !== 'collected' || !o.collectedAt) return;
      const d = new Date(o.collectedAt);
      const dLocalStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (dLocalStr === todayStr) today++;
      if (d >= weekStart) week++;
      if (d >= monthStart) month++;
    });

    [['statToday', today], ['statWeek', week], ['statMonth', month]].forEach(([id, n]) => {
      const el = document.getElementById(id);
      el.dataset.value = n;
      el.textContent = n;
    });
  }

  function renderPriorityPanel() {
    const urgent = state.orders
      .filter(o => o.status !== 'collected' && daysBetween(todayISO(), o.dueDate) <= 1)
      .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

    const panel = document.getElementById('priorityPanel');
    if (urgent.length === 0) {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    document.getElementById('priorityList').innerHTML = urgent.map(o => {
      const badge = dueBadge(o);
      return `
      <div class="priority-row">
        <div>
          <span class="pclient">${escapeHtml(o.client)}</span>
          &nbsp;·&nbsp;
          <span class="pitems">${escapeHtml(o.items)}</span>
        </div>
        <span class="pbadge ${badge.cls}">${badge.text}</span>
      </div>`;
    }).join('');
  }

  function updateTopCounts() {
    const active = state.orders.filter(o => o.status !== 'collected').length;
    const urgent = state.orders.filter(o => o.status !== 'collected' && daysBetween(todayISO(), o.dueDate) <= 1).length;
    const dateStr = formatLongDate(todayISO());
    const parts = [dateStr, `${active} active`];
    if (urgent > 0) parts.push(`${urgent} need${urgent === 1 ? 's' : ''} attention`);
    document.getElementById('topCounts').textContent = parts.join(' \u00B7 ');
  }

  // ---- Light / dark theme toggle ----
  const themeKnob = document.getElementById('themeKnob');
  function syncKnob() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeKnob.innerHTML = dark ? '<i class="ti ti-moon" aria-hidden="true"></i>' : '<i class="ti ti-sun" aria-hidden="true"></i>';
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('turntrack-theme', next); } catch (e) {}
    syncKnob();
  });
  syncKnob();

  // ---- Dashboard intro animation (count-up numbers, growing bars) ----
  function playDashboardIntro() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const chart = document.getElementById('trendChart');
    chart.classList.remove('animate');
    void chart.offsetWidth;
    chart.classList.add('animate');
    ['statToday', 'statWeek', 'statMonth'].forEach(id => {
      const el = document.getElementById(id);
      let start = null;
      function step(ts) {
        if (start === null) start = ts;
        const p = Math.min((ts - start) / 800, 1);
        const target = Number(el.dataset.value || 0);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  // ---- Dashboard/Orders routing ----
  let currentPage = 'dashboard';
  function showPage(page) {
    currentPage = page;
    document.getElementById('dashboardView').style.display = page === 'dashboard' ? '' : 'none';
    document.getElementById('ordersView').style.display = page === 'orders' ? '' : 'none';
    document.getElementById('navDashboard').classList.toggle('active', page === 'dashboard');
    document.getElementById('navOrders').classList.toggle('active', page === 'orders');
    document.getElementById('pageTitle').textContent = page === 'dashboard' ? 'Dashboard' : 'Orders';
    if (page === 'dashboard') playDashboardIntro();
  }
  document.getElementById('navDashboard').addEventListener('click', () => showPage('dashboard'));
  document.getElementById('navOrders').addEventListener('click', () => showPage('orders'));

  function renderRecentActivity() {
    const recent = state.orders.slice()
      .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))
      .slice(0, 6);
    const el = document.getElementById('recentActivity');
    if (recent.length === 0) {
      el.innerHTML = `<p class="empty-state" style="padding:10px 0;">No activity yet.</p>`;
      return;
    }
    el.innerHTML = recent.map(o => `
      <div class="activity-row">
        <div>
          <p class="aclient">${escapeHtml(o.client)}</p>
          <p class="aitems">${escapeHtml(o.items)}</p>
        </div>
        <div class="activity-right">
          <span class="status-pill ${o.status}" style="cursor:default;" disabled>${STATUS_LABEL[o.status]}</span>
          <span class="atime">${relativeTime(o.createdAt)}</span>
        </div>
      </div>`).join('');
  }

  function renderTrend() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      days.push({ key, label: d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2), count: 0 });
    }
    state.orders.forEach(o => {
      if (!o.collectedAt) return;
      const d = new Date(o.collectedAt);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const day = days.find(x => x.key === key);
      if (day) day.count++;
    });
    const max = Math.max(1, ...days.map(d => d.count));
    document.getElementById('trendChart').innerHTML = days.map((d, i) => `
      <div class="trend-col">
        <div class="trend-bar-wrap"><div class="trend-bar" style="--h:${Math.max(4, (d.count / max) * 64)}px;animation-delay:${i * 0.05}s"></div></div>
        <p class="trend-count">${d.count}</p>
        <p class="trend-label">${d.label}</p>
      </div>`).join('');
  }

  function render() {
    updateClientList();
    renderPriorityPanel();
    renderHistoryStats();
    renderRecentActivity();
    renderTrend();
    updateTopCounts();

    let orders = state.orders.slice();
    if (filterStatus !== 'all') {
      orders = orders.filter(o => o.status === filterStatus);
    } else if (!showCollected) {
      orders = orders.filter(o => o.status !== 'collected');
    }
    if (searchTerm.trim()) {
      const q = searchTerm.trim().toLowerCase();
      orders = orders.filter(o => o.client.toLowerCase().includes(q));
    }
    if (filterStatus === 'collected') {
      orders.sort((a, b) => (b.collectedAt || '').localeCompare(a.collectedAt || ''));
    } else {
      orders.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    }

    const tbody = document.getElementById('ordersList');
    if (orders.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No orders to show.</td></tr>`;
      return;
    }

    tbody.innerHTML = orders.map(o => {
      const badge = dueBadge(o);
      const rcls = rowClass(o, badge);
      const nextStatus = STATUS_ORDER[Math.min(STATUS_ORDER.indexOf(o.status) + 1, STATUS_ORDER.length - 1)];
      const canAdvance = o.status !== 'collected';
      const isUrgent = canAdvance && (badge.cls === 'overdue' || badge.cls === 'soon');
      const pillClass = `status-pill ${o.status}${isUrgent ? ' urgent' : ''}`;
      const advanceAttrs = canAdvance
        ? `data-id="${o.id}" data-next="${nextStatus}" title="Click to mark ${STATUS_LABEL[nextStatus]}"`
        : 'disabled';
      return `
      <tr class="${rcls}">
        <td class="client-cell">
          <p class="name">${escapeHtml(o.client)}</p>
          <p class="items">${escapeHtml(o.items)}</p>
          ${o.notes ? `<p class="row-notes">${escapeHtml(o.notes)}</p>` : ''}
        </td>
        <td class="mono">${formatDate(o.dateIn)}</td>
        <td class="mono">${formatDate(o.dueDate)} <span class="turnaround">(${o.turnaroundDays}d)</span></td>
        <td><button type="button" class="${pillClass}" ${advanceAttrs}>${STATUS_LABEL[o.status]}</button></td>
        <td><span class="badge ${badge.cls}">${badge.text}</span></td>
        <td class="right">
          <div class="row-actions">
            <button class="icon-btn edit-btn" data-id="${o.id}" title="Edit order" aria-label="Edit order"><i class="ti ti-pencil" aria-hidden="true"></i></button>
            <button class="icon-btn ticket-btn" data-id="${o.id}" title="Print ticket" aria-label="Print ticket"><i class="ti ti-printer" aria-hidden="true"></i></button>
            <button class="icon-btn delete-btn" data-id="${o.id}" title="Delete" aria-label="Delete order"><i class="ti ti-trash" aria-hidden="true"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('.status-pill[data-id]').forEach(btn => {
      btn.addEventListener('click', () => setStatus(btn.dataset.id, btn.dataset.next));
    });
    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteOrder(btn.dataset.id));
    });
    tbody.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = state.orders.find(x => x.id === btn.dataset.id);
        if (o) openOrderModal(o);
      });
    });
    tbody.querySelectorAll('.ticket-btn').forEach(btn => {
      btn.addEventListener('click', () => printTicket(btn.dataset.id));
    });
  }

  function showBanner(msg) {
    const b = document.getElementById('statusBanner');
    b.textContent = msg;
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 4000);
  }

  // ---- Supabase-backed actions. Local state is updated by the realtime
  // subscription below, not by these functions directly, so every
  // connected device converges on the same data. ----
  // Merge a row returned by Supabase straight into local state so the UI
  // updates instantly (the realtime feed then just confirms it).
  function applyRow(row) {
    if (!row) return;
    const o = fromDb(row);
    const idx = state.orders.findIndex(x => x.id === o.id);
    if (idx >= 0) state.orders[idx] = o; else state.orders.push(o);
    if (!state.clients.includes(o.client)) state.clients.push(o.client);
    render();
  }

  async function setStatus(id, status) {
    const patch = { status };
    patch.collected_at = status === 'collected' ? new Date().toISOString() : null;
    const { data, error } = await sb.from('orders').update(patch).eq('id', id).select();
    if (error) { showBanner('Could not update — check your connection.'); return; }
    applyRow(data && data[0]);
  }

  function printTicket(id) {
    const o = state.orders.find(x => x.id === id);
    if (!o) return;
    const badge = dueBadge(o);
    const dueLabel = o.status === 'collected' ? 'Collected' : badge.text.toUpperCase();
    document.getElementById('ticketModalContent').innerHTML = `
      <p class="t-client">${escapeHtml(o.client)}</p>
      <p class="t-due">${dueLabel} &mdash; ${formatDate(o.dueDate)}</p>
      <div class="t-row"><span class="t-label">Items</span><br>${escapeHtml(o.items)}</div>
      <div class="t-row"><span class="t-label">Dropped off</span><br>${formatDate(o.dateIn)}</div>
      ${o.notes ? `<div class="t-row"><span class="t-label">Notes</span><br>${escapeHtml(o.notes)}</div>` : ''}
      <p class="t-ref">Ref: ${o.id.slice(-6).toUpperCase()}</p>
    `;
    document.getElementById('printTicket').classList.add('show');
  }

  document.getElementById('ticketPrintBtn').addEventListener('click', () => {
    try { window.print(); } catch (e) { /* some sandboxed views block this; the modal itself stays visible so the ticket can still be read or screenshotted */ }
  });
  document.getElementById('ticketCloseBtn').addEventListener('click', () => {
    document.getElementById('printTicket').classList.remove('show');
  });
  document.getElementById('printTicket').addEventListener('click', (e) => {
    if (e.target.id === 'printTicket') e.target.classList.remove('show');
  });

  async function deleteOrder(id) {
    if (!confirm('Delete this order?')) return;
    const { error } = await sb.from('orders').delete().eq('id', id);
    if (error) { showBanner('Could not delete — check your connection.'); return; }
    state.orders = state.orders.filter(o => o.id !== id);
    render();
  }

  // ---- Add-order modal open/close ----
  const addOrderModal = document.getElementById('addOrderModal');
  let editingId = null;

  function openOrderModal(order) {
    if (order) {
      editingId = order.id;
      document.getElementById('clientInput').value = order.client;
      document.getElementById('itemsInput').value = order.items;
      document.getElementById('dateInInput').value = order.dateIn;
      document.getElementById('dueDateInput').value = order.dueDate;
      document.getElementById('notesInput').value = order.notes || '';
      document.getElementById('orderModalTitle').textContent = 'Edit order';
      document.getElementById('orderSubmitBtn').textContent = 'Save changes';
    } else {
      editingId = null;
      document.getElementById('orderForm').reset();
      document.getElementById('dateInInput').value = todayISO();
      document.getElementById('dueDateInput').value = addDays(todayISO(), 4);
      document.getElementById('orderModalTitle').textContent = 'Log a new order';
      document.getElementById('orderSubmitBtn').textContent = 'Add order';
    }
    addOrderModal.classList.add('show');
  }

  function closeOrderModal() {
    addOrderModal.classList.remove('show');
    editingId = null;
  }

  document.getElementById('addOrderBtn').addEventListener('click', () => openOrderModal(null));
  document.getElementById('addOrderCloseBtn').addEventListener('click', closeOrderModal);
  addOrderModal.addEventListener('click', (e) => { if (e.target === addOrderModal) closeOrderModal(); });

  document.getElementById('orderForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!locationRow) { showBanner('Still loading — try again in a moment.'); return; }
    const client = document.getElementById('clientInput').value.trim();
    const items = document.getElementById('itemsInput').value.trim();
    const dateIn = document.getElementById('dateInInput').value;
    const dueDate = document.getElementById('dueDateInput').value;
    const notes = document.getElementById('notesInput').value.trim();
    if (!client || !items || !dateIn || !dueDate) return;

    const fields = {
      client, items,
      notes: notes || null,
      date_in: dateIn,
      due_date: dueDate,
      turnaround_days: Math.max(0, daysBetween(dateIn, dueDate))
    };
    const idToEdit = editingId;
    closeOrderModal();

    if (idToEdit) {
      const { data, error } = await sb.from('orders').update(fields).eq('id', idToEdit).select();
      if (error) { showBanner('Could not save changes — check your connection.'); return; }
      applyRow(data && data[0]);
    } else {
      const { data, error } = await sb.from('orders')
        .insert({ ...fields, location_id: locationRow.id, status: 'pending' }).select();
      if (error) { showBanner('Could not save order — check your connection.'); return; }
      applyRow(data && data[0]);
    }
  });

  document.getElementById('dateInInput').addEventListener('change', () => {
    const dateIn = document.getElementById('dateInInput').value;
    const dueInput = document.getElementById('dueDateInput');
    if (dateIn && (!dueInput.value || dueInput.value < dateIn)) {
      dueInput.value = addDays(dateIn, 4);
    }
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value;
    if (searchTerm.trim() && currentPage !== 'orders') showPage('orders');
    render();
  });
  document.getElementById('showCollected').addEventListener('change', e => { showCollected = e.target.checked; render(); });
  document.getElementById('statusFilter').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filterStatus = btn.dataset.status;
    document.querySelectorAll('#statusFilter .chip').forEach(c => c.classList.toggle('active', c === btn));
    render();
  });

  function csvField(v) {
    const s = String(v ?? '');
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportTodayCSV() {
    const todayStr = todayISO();
    const rows = state.orders.filter(o => {
      const loggedToday = o.dateIn === todayStr;
      const stillOpen = o.status !== 'collected';
      let collectedToday = false;
      if (o.collectedAt) {
        const d = new Date(o.collectedAt);
        const dStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        collectedToday = dStr === todayStr;
      }
      return loggedToday || collectedToday || stillOpen;
    });

    if (rows.length === 0) {
      showBanner('No orders to export today.');
      return;
    }

    const header = ['Client', 'Items', 'Date In', 'Due Date', 'Turnaround (days)', 'Status', 'Collected At', 'Notes'];
    const lines = [header.map(csvField).join(',')];
    rows.forEach(o => {
      lines.push([
        o.client, o.items, o.dateIn, o.dueDate, o.turnaroundDays, STATUS_LABEL[o.status],
        o.collectedAt ? formatDate(o.collectedAt.slice(0, 10)) : '', o.notes || ''
      ].map(csvField).join(','));
    });
    const csv = '\ufeff' + lines.join('\r\n');

    const slug = (locationRow && locationRow.business_name ? locationRow.business_name : 'turntrack')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${slug}-orders-${todayStr}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById('exportTodayBtn').addEventListener('click', exportTodayCSV);

  document.getElementById('dateInInput').value = todayISO();
  document.getElementById('dueDateInput').value = addDays(todayISO(), 4);

  // ---- Load this location's branding and apply it ----
  async function loadLocation() {
    const { data, error } = await sb.from('locations').select('*').eq('slug', LOCATION_SLUG).single();
    if (error || !data) {
      document.getElementById('ordersList').innerHTML = `<tr><td colspan="6" class="empty-state">Could not load this location. Check the link.</td></tr>`;
      showBanner('Could not load this location.');
      return;
    }
    locationRow = data;
    document.title = `TurnTrack for ${data.business_name}`;
    document.getElementById('brandName').textContent = 'TurnTrack';
    document.getElementById('brandSub').textContent = data.business_name;
    document.getElementById('avatarInitials').textContent = initialsFrom(data.business_name);
    const logo = document.getElementById('brandLogoImg');
    if (data.logo_data_url) {
      logo.src = data.logo_data_url;
      logo.alt = data.business_name;
      logo.style.display = '';
    }
    const root = document.documentElement.style;
    if (data.color_accent) root.setProperty('--teal', data.color_accent);
    if (data.color_progress) root.setProperty('--navy', data.color_progress);
  }

  async function loadOrders() {
    const { data, error } = await sb.from('orders').select('*').eq('location_id', locationRow.id);
    if (error) {
      showBanner('Could not load orders — check your connection.');
      return;
    }
    state.orders = data.map(fromDb);
    state.clients = [...new Set(state.orders.map(o => o.client))];
    render();
    playDashboardIntro();
  }

  function subscribeRealtime() {
    sb.channel('orders-' + locationRow.id)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: 'orders',
        filter: `location_id=eq.${locationRow.id}`
      }, payload => {
        if (payload.eventType === 'INSERT') {
          if (!state.orders.find(o => o.id === payload.new.id)) {
            state.orders.push(fromDb(payload.new));
            if (!state.clients.includes(payload.new.client)) state.clients.push(payload.new.client);
          }
        } else if (payload.eventType === 'UPDATE') {
          const idx = state.orders.findIndex(o => o.id === payload.new.id);
          if (idx >= 0) state.orders[idx] = fromDb(payload.new);
        } else if (payload.eventType === 'DELETE') {
          state.orders = state.orders.filter(o => o.id !== payload.old.id);
        }
        render();
      })
      .subscribe();
  }

  async function init() {
    if (!sb) {
      document.getElementById('ordersList').innerHTML = `<tr><td colspan="6" class="empty-state">Could not connect — check your internet connection and reload.</td></tr>`;
      return;
    }
    await loadLocation();
    if (!locationRow) return;
    await loadOrders();
    subscribeRealtime();
  }
  init();
})();

</script>
</body>
</html>
